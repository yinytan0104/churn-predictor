name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare data
        run: python prepare.py

      - name: Train models
        run: python train.py
        env:
          SEARCH_ITER: "3"   # fast mode: 3 random search iterations instead of 20
